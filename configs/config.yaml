data:
  csv_path: data/sample_transactions.csv
  sequence_length: 30
  test_size: 0.2
  anomaly_label_column: is_anomaly
features:
  numeric_cols:
    - amount
    - balance_before
    - balance_after
    - transaction_hour
    - day_of_week
    - days_since_last_txn
model:
  input_size: 6
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
training:
  epochs: 50
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 1.0e-5
  patience: 7
threshold:
  percentile: 99
output:
  checkpoint_path: checkpoints/best_model.pt
  scaler_path: checkpoints/scaler.joblib
  threshold_path: checkpoints/threshold.json
